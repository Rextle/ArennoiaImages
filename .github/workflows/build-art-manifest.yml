name: Build art manifest

on:
  push:
    paths:
      - "Art/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Art/manifest.js
        run: |
          node -e '
            const fs = require("fs");
            const dir = "Art";
            const exts = /\.(png|jpe?g|webp|gif)$/i;
            const files = fs.existsSync(dir)
              ? fs.readdirSync(dir).filter(f => exts.test(f) && f !== "manifest.js")
              : [];
            files.sort((a, b) => a.localeCompare(b));
            const out = "window.__arennoiaArtManifest = " + JSON.stringify(files, null, 2) + ";\n";
            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(dir + "/manifest.js", out);
            console.log("Wrote manifest with " + files.length + " file(s):", files);
          '

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Art/manifest.js
          git diff --staged --quiet || git commit -m "Update art manifest"
          git push
